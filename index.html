<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Conferência semanal – Loja FAB</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
:root{--ink:#0e1b2e;--navy:#14284b;--navy2:#1f3c6e;--gold:#b08d4f;--gold2:#e6d3a8;--bg:#f3f1ec;--card:#fff;--line:#e4e0d6;--txt:#1b2536;--mut:#6b7385;--ok:#17724a;--no:#a8322a;--nc:#9a6200;--novo:#0e6c8c}
*{box-sizing:border-box}
body{margin:0;font:14.5px/1.5 Manrope,"Segoe UI",system-ui,sans-serif;color:var(--txt);background:var(--bg)}
header{background:linear-gradient(120deg,var(--ink),var(--navy2));color:#fff;padding:26px 28px;border-bottom:3px solid var(--gold)}
header h1{margin:0;font-size:22px;font-weight:700;letter-spacing:.3px}
header p{margin:4px 0 0;color:var(--gold2);font-size:13px}
main{max-width:1280px;margin:0 auto;padding:24px 20px 60px}
button,select,input,textarea{font:inherit}
button{background:linear-gradient(135deg,var(--navy),var(--navy2));color:#fff;border:0;border-radius:9px;padding:9px 18px;cursor:pointer;font-weight:600;transition:filter .15s}
button:hover{filter:brightness(1.15)}
button.sec{background:#fff;color:var(--navy);border:1px solid var(--line)}
button.sec:hover{border-color:var(--gold);filter:none;background:#fbf8f1}
button.gold{background:linear-gradient(135deg,#9c7a3c,var(--gold));color:#fff}
button:disabled{opacity:.5;cursor:default}
:focus-visible{outline:2px solid var(--gold);outline-offset:2px}
.card{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:22px;margin-bottom:18px;box-shadow:0 1px 2px rgba(20,40,75,.04),0 12px 32px -18px rgba(20,40,75,.18)}
.row{display:flex;gap:12px;flex-wrap:wrap;align-items:center}
.hide{display:none!important}
input[type=text],input[type=date],input[type=number],select{border:1px solid var(--line);border-radius:9px;padding:8px 11px;background:#fff;color:var(--txt)}
h2{font-size:17px;margin:0 0 14px;font-weight:700;color:var(--navy)}
label{color:var(--mut);font-size:13px;font-weight:500}
.mut{color:var(--mut)}
.resumo{display:flex;gap:12px;flex-wrap:wrap;margin-bottom:16px}
.resumo>div{background:var(--card);border:1px solid var(--line);border-top:3px solid var(--navy);border-radius:12px;padding:14px 18px;min-width:140px;color:var(--mut);font-size:13px}
.resumo b{display:block;font-size:28px;font-weight:800;color:var(--ink);line-height:1.2}
.tabs{display:flex;gap:6px;margin-bottom:14px;flex-wrap:wrap}
.tabs button{background:#fff;color:var(--mut);border:1px solid var(--line);border-radius:999px;padding:7px 16px}
.tabs button.on{background:var(--navy);color:#fff;border-color:var(--navy)}
.wrap{overflow-x:auto;background:#fff;border:1px solid var(--line);border-radius:14px}
table{border-collapse:collapse;width:100%;min-width:640px}
th,td{padding:11px 14px;border-bottom:1px solid #eeebe3;text-align:left;vertical-align:middle}
th{background:#f8f6f0;font-weight:700;font-size:13px;color:var(--navy);position:sticky;top:0}
tbody tr:hover{background:#fbfaf6}
td a{color:var(--navy2);text-decoration:none;font-weight:500}td a:hover{text-decoration:underline}
td input[type=text]{width:100%}
.tag{font-size:11px;padding:2px 9px;border-radius:10px;background:var(--novo);color:#fff;white-space:nowrap;font-weight:600}
.tag.rem{background:var(--no)}.tag.pr{background:var(--nc)}.tag.rep{background:#7a8296}
.alerta{flex:1 1 100%;border-radius:12px;padding:14px 20px;border:1px solid;display:flex;gap:20px;flex-wrap:wrap;align-items:center}
.alerta.warn{background:#fdf3de;border-color:#e2c68a;color:#6b3d00;font-size:15px}
.alerta.warn span{font-weight:600}
.alerta.ok{background:#e6f4ec;border-color:#9fd0b4;color:var(--ok)}
.alerta.info{background:#eef2f8;border-color:var(--line)}
#msg{position:fixed;bottom:18px;right:18px;background:var(--ink);color:#fff;padding:11px 18px;border-radius:10px;max-width:360px;box-shadow:0 10px 30px rgba(0,0,0,.25)}
#drop{border:2px dashed #cfc8b6;border-radius:14px;padding:28px;text-align:center;background:#faf8f3;color:var(--mut)}
#drop.over{border-color:var(--gold);background:#f6efe0}
.err{color:var(--no)}
#rel{display:none}
@media print{
  @page{margin:14mm}
  body.pdf header,body.pdf main,body.pdf #msg{display:none!important}
  body.pdf{background:#fff}
  body.pdf #rel{display:block;color:#000;font-size:11px}
  #rel h1{font-size:18px;margin:0 0 2px;color:var(--navy)}
  #rel h3{font-size:13px;margin:18px 0 6px;padding-bottom:4px;border-bottom:2px solid var(--gold);color:var(--navy)}
  #rel table{min-width:0;width:100%}
  #rel th,#rel td{padding:5px 7px;font-size:10.5px;border-bottom:1px solid #ddd}
  #rel th{position:static;background:#eee}
  #rel thead{display:table-header-group}#rel tr{page-break-inside:avoid}
}
</style>
</head>
<body>

<header>
  <h1>Conferência semanal · Loja oficial FAB</h1>
  <p>Mercado Livre — controle de produtos incluídos, excluídos e preços</p>
</header>

<main>
  <section id="app">
    <div class="card">
      <h2>Nova conferência</h2>
      <div class="row" style="margin-bottom:14px">
        <label>Data da conferência <input type="date" id="dataConf"></label>
        <label>Total que a loja mostra <input type="number" id="totalLoja" min="0" placeholder="ex.: 245" style="width:110px"></label>
      </div>
      <div id="drop">
        Arraste aqui os PDFs das páginas da loja<br><small>(no navegador: Ctrl+P → Salvar como PDF)</small><br>
        <button class="sec" id="escolher" style="margin-top:10px">Escolher PDFs</button>
        <input type="file" id="arq" accept="application/pdf" multiple class="hide">
        <div id="arqLista" style="margin-top:10px"></div>
      </div>
      <div class="row" style="margin-top:16px">
        <button id="gerar" class="gold">Gerar e salvar conferência</button>
        <span id="gerarMsg" class="mut"></span>
      </div>
      <div id="diag"></div>
    </div>

    <div class="card">
      <div class="row">
        <label>Conferência <select id="selConf"></select></label>
        <label>Comparar com <select id="selBase"></select></label>
        <button class="sec" id="csv">Exportar Excel (CSV)</button>
        <button class="sec" id="pdf">Exportar PDF</button>
        <button class="sec" id="apagar">Apagar esta conferência</button>
        <button class="sec" id="zerarTudo">Apagar tudo</button>
      </div>
    </div>

    <div id="vista" class="hide">
      <div class="resumo" id="resumo"></div>
      <div class="tabs" id="tabs"></div>
      <div class="row" style="margin-bottom:12px">
        <input type="text" id="busca" placeholder="Buscar produto" style="min-width:300px">
      </div>
      <div class="wrap"><table><thead id="thead"></thead><tbody id="tbody"></tbody></table></div>
    </div>
    <p id="vazio" class="mut">Nenhuma conferência ainda. Gere a primeira acima.</p>

    <div class="card" id="histCard" style="margin-top:18px">
      <h2>Histórico</h2>
      <div class="wrap" id="historico"></div>
    </div>
  </section>
</main>
<div id="msg" class="hide"></div>
<div id="rel"></div>

<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore-compat.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.min.js"></script>
<script>
const FIREBASE_CONFIG = {
  apiKey: "AIzaSyD4rPblB8lGb_HWFYfUYkq8um85uAbM4vU",
  authDomain: "mercado-livre-dfb32.firebaseapp.com",
  projectId: "mercado-livre-dfb32",
  storageBucket: "mercado-livre-dfb32.firebasestorage.app",
  messagingSenderId: "663540272674",
  appId: "1:663540272674:web:46fc655e12abcf484c047b"
};

firebase.initializeApp(FIREBASE_CONFIG);
const db = firebase.firestore();
pdfjsLib.GlobalWorkerOptions.workerSrc = "https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.worker.min.js";

const $ = s => document.querySelector(s);
const esc = s => String(s ?? "").replace(/[&<>"]/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" }[c]));
const REVISOES = 3;
const SEM_NOME = "Nome não identificado";

let confs = [], cur = null, baseId = "", tab = "todos", saveTimer = null;
let diag = { links: 0, semId: [], dup: [] };

function aviso(t, erro) {
  const m = $("#msg"); m.textContent = t; m.classList.remove("hide");
  m.style.background = erro ? "#a8322a" : "";
  clearTimeout(aviso.t); aviso.t = setTimeout(() => m.classList.add("hide"), 3000);
}

const dt = d => d.split("-").reverse().join("/");
const hora = c => c.criadoEm?.seconds
  ? new Date(c.criadoEm.seconds * 1000).toLocaleTimeString("pt-BR", { hour: "2-digit", minute: "2-digit" }) : "agora";
const rotulo = c => `${dt(c.data)} ${hora(c)}`;

$("#dataConf").valueAsDate = new Date();
carregar().catch(e => aviso("Erro ao conectar ao Firebase: " + e.message, true));

/* ---------- Nomes e códigos ---------- */
const idDe = u => { const m = String(u).match(/(MLBU?)[-_]?(\d{6,})/i); return m ? m[1].toUpperCase() + m[2] : null; };
const ehCodigo = s => /^\s*MLBU?-?\d{6,}\s*$/i.test(String(s ?? ""));
const nomeValido = s => { const t = String(s ?? "").replace(/\s+/g, " ").trim(); return t.length > 2 && !ehCodigo(t) ? t : ""; };
const tituloDeUrl = u => {
  try {
    const d = decodeURIComponent(String(u));
    const m = d.match(/MLBU?-?\d+-(.+?)-?_(?:JM|NQ|Q)/i) || d.match(/MLBU?-?\d+-([^\/?#_]+)/i);
    return m ? nomeValido(m[1].replace(/-/g, " ")) : "";
  } catch (e) { return ""; }
};
const nomeProximo = (cx, cy, tx) => tx
  .filter(t => !ehCodigo(t.s) && !/R\$/.test(t.s) && /[A-Za-zÀ-ú]{3,}/.test(t.s) && Math.abs(t.x - cx) < 160 && Math.abs(t.y - cy) < 60)
  .sort((a, b) => Math.hypot(a.x - cx, a.y - cy) - Math.hypot(b.x - cx, b.y - cy))
  .map(t => t.s)[0] || "";

const novoItem = (i, t, k, p) => ({ i, t: nomeValido(t) || SEM_NOME, k: k || "", p: p || "", o: "" });
const maisComum = vals => {
  const c = new Map();
  for (const v of vals) if (v) c.set(v, (c.get(v) || 0) + 1);
  let best = "", n = 0;
  for (const [v, k] of c) if (k > n || (k === n && v.length > best.length)) { best = v; n = k; }
  return best;
};

/* ---------- Preço à vista ---------- */
const ehParcela = (t, tx) => /\d+\s*x\s*R\$/i.test(t.s) ||
  tx.some(o => Math.abs(o.y - t.y) < 6 && o.x < t.x && t.x - o.x < 40 && /^\d+\s*x$/i.test(o.s));
const ehCupom = (t, tx) => tx.some(o => Math.abs(o.y - t.y) < 6 && Math.abs(o.x - t.x) < 160 && /cupom/i.test(o.s));
const precoAVista = (cx, cy, tx) => {
  const cand = tx.filter(t => /R\$/.test(t.s) && Math.abs(t.x - cx) < 200 && Math.abs(t.y - cy) < 150 && !ehParcela(t, tx) && !ehCupom(t, tx));
  if (!cand.length) return "";
  const maior = Math.max(...cand.map(t => Math.round(t.h)));
  const rs = cand.filter(t => Math.round(t.h) === maior)
    .sort((a, b) => Math.hypot(a.x - cx, a.y - cy) - Math.hypot(b.x - cx, b.y - cy))[0];
  const trecho = tx.filter(t => Math.abs(t.y - rs.y) < 6 && t.x >= rs.x - 2 && t.x < rs.x + 120)
    .sort((a, b) => a.x - b.x).map(t => t.s).join(" ");
  const m = trecho.match(/R\$\s*([\d.]+(?:,\d{2})?)/);
  return m ? m[1] : "";
};

/* ---------- Leitura dos PDFs ---------- */
async function lerPDF(file) {
  const pdf = await pdfjsLib.getDocument({ data: await file.arrayBuffer() }).promise, out = [];
  for (let n = 1; n <= pdf.numPages; n++) {
    const pg = await pdf.getPage(n);
    const [tc, an] = await Promise.all([pg.getTextContent(), pg.getAnnotations()]);
    const tx = tc.items.filter(t => t.str.trim()).map(t => ({
      s: t.str.trim(), x: t.transform[4], y: t.transform[5], h: t.height || Math.abs(t.transform[3]) || 0
    }));
    for (const a of an) {
      if (a.subtype !== "Link" || !a.url) continue;
      diag.links++;
      const id = idDe(a.url); if (!id) { diag.semId.push(a.url); continue; }
      const [x1, y1, x2, y2] = a.rect;
      const cx = (x1 + x2) / 2, cy = (y1 + y2) / 2;
      const dentro = tx.filter(t => t.x >= x1 - 2 && t.x <= x2 + 2 && t.y >= y1 - 3 && t.y <= y2 + 3)
        .filter(t => !ehCodigo(t.s) && !/R\$/.test(t.s)).map(t => t.s).join(" ");
      const titulo = nomeValido(dentro) || tituloDeUrl(a.url) || nomeProximo(cx, cy, tx);
      out.push(novoItem(id, titulo, a.url, precoAVista(cx, cy, tx)));
    }
  }
  return out;
}

// Todas as ocorrências viram itens (repetidos aparecem). 1ª ocorrência = código; demais = código#2, #3…
function unir(lista) {
  const nomes = new Map();
  for (const it of lista) { if (!nomes.has(it.i)) nomes.set(it.i, []); nomes.get(it.i).push(nomeValido(it.t)); }
  const nomeDe = new Map([...nomes].map(([k, v]) => [k, maisComum(v.filter(n => n && n !== SEM_NOME)) || SEM_NOME]));
  const cont = new Map(), saida = [];
  for (const it of lista) {
    const n = (cont.get(it.i) || 0) + 1; cont.set(it.i, n);
    if (n === 2) diag.dup.push(nomeDe.get(it.i));
    saida.push({ ...it, i: n === 1 ? it.i : it.i + "#" + n, t: nomeDe.get(it.i) });
  }
  return saida;
}

async function lerTudo() {
  diag = { links: 0, semId: [], dup: [] };
  let itens = [];
  for (const f of arquivos) itens = itens.concat(await lerPDF(f));
  return { itens: unir(itens), diag, linksTotal: diag.links };
}

function consenso(passagens) {
  const ref = passagens.reduce((a, b) => b.itens.length > a.itens.length ? b : a).itens;
  const mesmo = passagens.every(p => p.itens.length === ref.length);
  let divergencias = 0;
  const itens = ref.map((it, idx) => {
    if (!mesmo) return it;
    const nomes = passagens.map(p => { const n = p.itens[idx].t; return n === SEM_NOME ? "" : nomeValido(n); });
    const precos = passagens.map(p => p.itens[idx].p);
    if (new Set(nomes).size > 1 || new Set(precos).size > 1) divergencias++;
    return { ...it, t: maisComum(nomes) || SEM_NOME, p: maisComum(precos) };
  });
  return { itens, mesmo, divergencias, semNome: itens.filter(x => x.t === SEM_NOME).length, semPreco: itens.filter(x => !x.p).length };
}

/* ---------- Upload ---------- */
let arquivos = [];
const mostraArqs = () => $("#arqLista").textContent = arquivos.length ? arquivos.map(f => f.name).join(", ") : "";
$("#escolher").onclick = () => $("#arq").click();
$("#arq").onchange = e => { arquivos = [...arquivos, ...e.target.files]; mostraArqs(); };
const drop = $("#drop");
drop.ondragover = e => { e.preventDefault(); drop.classList.add("over"); };
drop.ondragleave = () => drop.classList.remove("over");
drop.ondrop = e => { e.preventDefault(); drop.classList.remove("over"); arquivos = [...arquivos, ...[...e.dataTransfer.files].filter(f => f.type === "application/pdf")]; mostraArqs(); };

$("#gerar").onclick = async () => {
  const btn = $("#gerar"), msg = $("#gerarMsg"); btn.disabled = true; msg.className = "mut";
  try {
    $("#diag").innerHTML = "";
    if (!arquivos.length) throw new Error("Escolha ou arraste os PDFs das páginas da loja.");
    const passagens = [];
    for (let r = 1; r <= REVISOES; r++) {
      msg.textContent = `Revisão ${r} de ${REVISOES}: lendo ${arquivos.length} PDF(s)…`;
      passagens.push(await lerTudo());
    }
    msg.textContent = "Cruzando as revisões…";
    const rev = consenso(passagens), itens = rev.itens;
    if (!itens.length) throw new Error("Nenhum produto encontrado nos PDFs. Salve as páginas da loja com Ctrl+P → Salvar como PDF.");
    if (itens.length > 3500) throw new Error("Limite de 3.500 produtos por conferência.");
    const totalLoja = parseInt($("#totalLoja").value, 10) || null;
    const data = $("#dataConf").value || new Date().toISOString().slice(0, 10);

    const ant = confs.find(c => c.data <= data);
    if (ant) {
      const mp = new Map(ant.itens.map(x => [x.i, x]));
      for (const it of itens) { const o = mp.get(it.i); if (o) it.o = o.o || ""; }
    }
    msg.textContent = "Salvando…";
    const ref = await db.collection("conferencias").add({ data, totalLoja, criadoEm: firebase.firestore.FieldValue.serverTimestamp(), itens });
    arquivos = []; mostraArqs(); $("#arq").value = ""; $("#totalLoja").value = "";
    baseId = "";
    msg.textContent = `${itens.length} produtos salvos em ${dt(data)}.`;
    mostraDiag(itens.length, rev, passagens[REVISOES - 1], totalLoja);
    await carregar(ref.id);
    const r = comparar();
    if (r.ant && (r.novos.length + r.removidos.length + r.alterados.length))
      alert(`ATENÇÃO – alterações em relação a ${rotulo(r.ant)}:\n\n• ${r.novos.length} item(ns) incluído(s)\n• ${r.removidos.length} item(ns) excluído(s)\n• ${r.alterados.length} preço(s) alterado(s)`);
  } catch (e) { msg.className = "err"; msg.textContent = e.message; }
  btn.disabled = false;
};

/* ---------- Dados ---------- */
async function carregar(abrirId) {
  const snap = await db.collection("conferencias").orderBy("data", "desc").get();
  confs = snap.docs.map(d => ({ id: d.id, ...d.data(), itens: d.data().itens || [] }))
    .sort((a, b) => b.data.localeCompare(a.data) || (b.criadoEm?.seconds || 0) - (a.criadoEm?.seconds || 0));
  $("#selConf").innerHTML = confs.map(c => `<option value="${c.id}">${rotulo(c)} – ${c.itens.length} produtos</option>`).join("");
  $("#vazio").classList.toggle("hide", !!confs.length);
  $("#vista").classList.toggle("hide", !confs.length);
  desenhaHistorico();
  if (confs.length) {
    const manter = cur && confs.some(c => c.id === cur.id) ? cur.id : confs[0].id;
    $("#selConf").value = abrirId || manter;
    abrir();
  }
}
$("#selConf").onchange = () => { baseId = ""; abrir(); };
$("#selBase").onchange = () => { baseId = $("#selBase").value; desenhar(); };

function abrir() { cur = confs.find(c => c.id === $("#selConf").value); tab = "todos"; desenhar(); }

function baseDe(rec) {
  if (baseId && baseId !== rec.id) { const b = confs.find(c => c.id === baseId); if (b) return b; }
  return confs[confs.indexOf(rec) + 1] || null;
}
function comparar() {
  const ant = baseDe(cur);
  const idsAnt = new Set((ant?.itens || []).map(x => x.i)), idsCur = new Set(cur.itens.map(x => x.i));
  const mapAnt = new Map((ant?.itens || []).map(x => [x.i, x]));
  const alterados = ant ? cur.itens.filter(x => {
    const o = mapAnt.get(x.i), a = num(o?.p), b = num(x.p);
    return o && a !== null && b !== null && a !== b;
  }) : [];
  return {
    ant, mapAnt, alterados,
    novos: ant ? cur.itens.filter(x => !idsAnt.has(x.i)) : [],
    mantidos: ant ? cur.itens.filter(x => idsAnt.has(x.i)) : cur.itens,
    removidos: ant ? ant.itens.filter(x => !idsCur.has(x.i)) : []
  };
}
const num = p => { if (!p) return null; const n = parseFloat(String(p).replace(/\./g, "").replace(",", ".")); return isNaN(n) ? null : n; };
const brl = n => n.toLocaleString("pt-BR", { minimumFractionDigits: 2, maximumFractionDigits: 2 });

/* ---------- Histórico ---------- */
function desenhaHistorico() {
  const el = $("#historico");
  if (!confs.length) { el.innerHTML = ""; return; }
  el.innerHTML = `<table style="min-width:0"><thead><tr><th>Data</th><th>Hora</th><th>Produtos</th><th>Total na loja</th><th></th></tr></thead><tbody>${confs.map(c => `<tr>
      <td>${dt(c.data)}</td><td>${hora(c)}</td><td>${c.itens.length}</td><td>${c.totalLoja ?? "—"}</td>
      <td><button class="sec" data-ver="${c.id}">Abrir</button>
          <button class="sec" data-base="${c.id}" ${c.id === cur?.id ? "disabled" : ""}>Comparar com esta</button></td>
    </tr>`).join("")}</tbody></table>`;
}
$("#historico").onclick = e => {
  const v = e.target.dataset.ver, b = e.target.dataset.base;
  if (v) { $("#selConf").value = v; baseId = ""; abrir(); }
  if (b) { baseId = b; desenhar(); aviso("Comparando com " + rotulo(confs.find(c => c.id === b))); }
};

function desenhaSelBase() {
  const opts = confs.filter(c => c.id !== cur.id).map(c => `<option value="${c.id}">${rotulo(c)} – ${c.itens.length} produtos</option>`).join("");
  $("#selBase").innerHTML = `<option value="">Automático (versão anterior)</option>` + opts;
  $("#selBase").value = baseId && confs.some(c => c.id === baseId && c.id !== cur.id) ? baseId : "";
}

/* ---------- Tela ---------- */
function desenhar() {
  if (!cur) return;
  desenhaSelBase();
  const c = comparar();
  const nN = c.novos.length, nR = c.removidos.length, nP = c.alterados.length;
  const lab = c.ant ? rotulo(c.ant) : "";
  let al = "";
  if (!c.ant) al = `<div class="alerta info">Primeira conferência: ainda não há com o que comparar.</div>`;
  else if (nN + nR + nP === 0) al = `<div class="alerta ok">Sem alterações em relação a ${lab}: nenhum item incluído ou excluído e nenhum preço alterado.</div>`;
  else al = `<div class="alerta warn"><b>ATENÇÃO – alterações em relação a ${lab}:</b>
    <span>${nN} item(ns) incluído(s)</span><span>${nR} item(ns) excluído(s)</span><span>${nP} preço(s) alterado(s)</span></div>`;
  const diffLoja = cur.totalLoja ? cur.totalLoja - cur.itens.length : null;
  const cardLoja = cur.totalLoja ? `<div style="border-top-color:${diffLoja ? "var(--no)" : "var(--ok)"}"><b>${cur.totalLoja}</b>na loja${diffLoja ? " (" + (diffLoja > 0 ? "faltam " : "sobram ") + Math.abs(diffLoja) + ")" : " (bate)"}</div>` : "";
  $("#resumo").innerHTML = al + `
    <div style="border-top-color:var(--gold)"><b>${cur.itens.length}</b>produtos em ${rotulo(cur)}</div>
    ${cardLoja}
    <div><b>${c.ant ? c.ant.itens.length : "—"}</b>${c.ant ? "em " + lab : "sem versão para comparar"}</div>
    <div style="border-top-color:var(--novo)"><b style="color:var(--novo)">${c.ant ? nN : "—"}</b>incluídos</div>
    <div style="border-top-color:var(--no)"><b style="color:var(--no)">${c.ant ? nR : "—"}</b>excluídos</div>
    <div style="border-top-color:var(--nc)"><b style="color:var(--nc)">${c.ant ? nP : "—"}</b>preços alterados</div>`;
  const T = [["todos", "Todos", cur.itens.length], ["novos", "Incluídos", nN], ["removidos", "Excluídos", nR], ["precos", "Preço alterado", nP], ["mantidos", "Mantidos", c.mantidos.length]];
  if (!c.ant) tab = "todos";
  $("#tabs").innerHTML = T.filter(t => c.ant || t[0] === "todos").map(t => `<button data-t="${t[0]}" class="${tab === t[0] ? "on" : ""}">${t[1]} (${t[2]})</button>`).join("");
  tabela(c);
}
$("#tabs").onclick = e => { const b = e.target.closest("button"); if (b) { tab = b.dataset.t; desenhar(); } };
$("#busca").oninput = () => tabela(comparar());

function tabela(c) {
  const rem = tab === "removidos";
  let lista = rem ? c.removidos : tab === "novos" ? c.novos : tab === "precos" ? c.alterados : tab === "mantidos" ? c.mantidos : cur.itens;
  const altIds = new Set(c.alterados.map(x => x.i)), novosIds = new Set(c.novos.map(x => x.i));
  const preco = x => {
    if (!x.p) return `<span class="mut">sem preço</span>`;
    if (!altIds.has(x.i)) return "R$ " + esc(x.p);
    const a = num(c.mapAnt.get(x.i).p), b = num(x.p), d = b - a, pc = a ? (d / a * 100) : 0;
    return `<s class="mut">R$ ${esc(c.mapAnt.get(x.i).p)}</s><br><b style="color:${d > 0 ? "var(--no)" : "var(--ok)"}">R$ ${esc(x.p)}</b>
      <div class="mut" style="font-size:12px">${d > 0 ? "▲ +" : "▼ −"}R$ ${brl(Math.abs(d))} (${pc > 0 ? "+" : "−"}${Math.abs(pc).toFixed(1).replace(".", ",")}%)</div>`;
  };
  const q = $("#busca").value.toLowerCase();
  if (q) lista = lista.filter(x => x.t.toLowerCase().includes(q));
  $("#thead").innerHTML = `<tr><th>Produto</th><th>Preço</th><th>Observação</th></tr>`;
  $("#tbody").innerHTML = lista.length ? lista.map(x => rem
    ? `<tr><td><span class="tag rem">excluído</span> ${esc(x.t)}</td><td>${x.p ? "R$ " + esc(x.p) : ""}</td><td>${esc(x.o)}</td></tr>`
    : `<tr><td>${novosIds.has(x.i) && c.ant ? '<span class="tag">incluído</span> ' : ""}${altIds.has(x.i) ? '<span class="tag pr">preço alterado</span> ' : ""}${x.i.includes("#") ? '<span class="tag rep">repetido</span> ' : ""}${x.k ? `<a href="${esc(x.k)}" target="_blank" rel="noopener">${esc(x.t)}</a>` : esc(x.t)}</td>
       <td>${preco(x)}</td>
       <td><input type="text" value="${esc(x.o)}" data-c="o" data-i="${esc(x.i)}" placeholder="Observação"></td></tr>`).join("")
    : `<tr><td colspan="3" class="mut">Nada para mostrar aqui.</td></tr>`;
}

$("#tbody").addEventListener("input", e => {
  const el = e.target; if (el.dataset.c !== "o") return;
  const it = cur.itens.find(x => x.i === el.dataset.i); if (!it) return;
  it.o = el.value;
  clearTimeout(saveTimer); saveTimer = setTimeout(salvar, 700);
});
async function salvar() {
  try { await db.collection("conferencias").doc(cur.id).update({ itens: cur.itens }); aviso("Salvo"); }
  catch (e) { aviso("Erro ao salvar: " + e.message, true); }
}

/* ---------- Exportar ---------- */
$("#csv").onclick = () => {
  const c = comparar(), nv = new Set(c.novos.map(x => x.i)), alt = new Set(c.alterados.map(x => x.i));
  const linhas = [["Situação", "Produto", "Preço", "Preço anterior", "Observação", "Link"]];
  cur.itens.forEach(x => linhas.push([c.ant ? (nv.has(x.i) ? "INCLUÍDO" : alt.has(x.i) ? "PREÇO ALTERADO" : "MANTIDO") : "", x.t, x.p, alt.has(x.i) ? c.mapAnt.get(x.i).p : "", x.o, x.k]));
  c.removidos.forEach(x => linhas.push(["EXCLUÍDO", x.t, "", x.p, x.o, x.k]));
  const csv = "\ufeff" + linhas.map(l => l.map(v => `"${String(v ?? "").replace(/"/g, '""')}"`).join(";")).join("\n");
  const a = document.createElement("a");
  a.href = URL.createObjectURL(new Blob([csv], { type: "text/csv;charset=utf-8" }));
  a.download = `conferencia-fab-${cur.data}.csv`; a.click();
};

// PDF geral: resumo + incluídos + excluídos + preços alterados + lista completa (sem links)
$("#pdf").onclick = () => {
  const c = comparar();
  const tb = (cab, linhas) => `<table><thead><tr>${cab.map(h => `<th>${h}</th>`).join("")}</tr></thead><tbody>${linhas.length ? linhas.map(l => `<tr>${l.map(v => `<td>${v}</td>`).join("")}</tr>`).join("") : `<tr><td colspan="${cab.length}">Nenhum item.</td></tr>`}</tbody></table>`;
  const pr = x => x.p ? "R$ " + esc(x.p) : "—";
  let h = `<h1>Conferência semanal · Loja oficial FAB</h1>
    <div>Conferência de ${rotulo(cur)} · ${cur.itens.length} produtos${cur.totalLoja ? " · total na loja: " + cur.totalLoja : ""}</div>`;
  if (c.ant) {
    h += `<div>Comparada com ${rotulo(c.ant)} (${c.ant.itens.length} produtos): <b>${c.novos.length} incluído(s)</b>, <b>${c.removidos.length} excluído(s)</b>, <b>${c.alterados.length} preço(s) alterado(s)</b></div>`;
    h += `<h3>Itens incluídos (${c.novos.length})</h3>` + tb(["Produto", "Preço"], c.novos.map(x => [esc(x.t), pr(x)]));
    h += `<h3>Itens excluídos (${c.removidos.length})</h3>` + tb(["Produto", "Último preço"], c.removidos.map(x => [esc(x.t), pr(x)]));
    h += `<h3>Preços alterados (${c.alterados.length})</h3>` + tb(["Produto", "Anterior", "Atual"], c.alterados.map(x => [esc(x.t), "R$ " + esc(c.mapAnt.get(x.i).p), pr(x)]));
  }
  h += `<h3>Lista completa (${cur.itens.length})</h3>` + tb(["#", "Produto", "Preço", "Observação"], cur.itens.map((x, n) => [n + 1, esc(x.t), pr(x), esc(x.o)]));
  $("#rel").innerHTML = h;
  document.body.classList.add("pdf");
  setTimeout(() => { window.print(); document.body.classList.remove("pdf"); }, 150);
};

function mostraDiag(total, rev, passagem, totalLoja) {
  const d = passagem.diag, cut = s => esc(s.length > 110 ? s.slice(0, 110) + "…" : s);
  const concord = rev.mesmo
    ? (rev.divergencias ? `${rev.divergencias} produto(s) com leitura divergente, resolvido(s) pela maioria` : "todas as leituras concordaram")
    : "a quantidade de produtos variou entre as leituras (verifique)";
  const diff = totalLoja ? totalLoja - total : null;
  const comparaLoja = totalLoja
    ? (diff === 0 ? `<b style="color:var(--ok)">bate com a loja (${totalLoja})</b>`
      : `<b style="color:var(--no)">${diff > 0 ? "faltam " + diff : "sobram " + (-diff)} em relação à loja (${totalLoja})</b>`)
    : `<span class="mut">total da loja não informado</span>`;
  $("#diag").innerHTML = `<details open style="margin-top:12px"><summary>Relatório da leitura</summary>
    <p class="mut" style="margin:6px 0">Revisões: ${REVISOES} leituras completas · ${concord}</p>
    <p style="margin:6px 0"><b>${total} itens</b> · ${passagem.linksTotal} links lidos · ${comparaLoja}</p>
    <p class="mut" style="margin:6px 0">sem nome: ${rev.semNome} · sem preço: ${rev.semPreco}</p>
    ${d.dup.length ? `<p style="margin:6px 0"><b>Produtos repetidos nas páginas (todos listados, marcados como “repetido”):</b></p><ul>${d.dup.map(t => `<li>${cut(t)}</li>`).join("")}</ul>` : ""}
    ${d.semId.length ? `<details><summary class="mut">${d.semId.length} links sem código de produto (menus, rodapé, filtros…)</summary><ul>${d.semId.slice(0, 300).map(u => `<li>${cut(u)}</li>`).join("")}</ul></details>` : ""}
  </details>`;
}

$("#zerarTudo").onclick = async () => {
  if (!confs.length) return;
  if (prompt(`Isso apaga TODAS as ${confs.length} conferências. Digite APAGAR para confirmar:`) !== "APAGAR") return;
  await Promise.all(confs.map(c => db.collection("conferencias").doc(c.id).delete()));
  $("#diag").innerHTML = ""; baseId = ""; aviso("Tudo apagado"); carregar();
};
$("#apagar").onclick = async () => {
  if (!cur || !confirm("Apagar a conferência de " + rotulo(cur) + "? Isso não pode ser desfeito.")) return;
  await db.collection("conferencias").doc(cur.id).delete(); baseId = ""; carregar();
};
</script>
</body>
</html>
